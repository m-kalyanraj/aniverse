<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniVerse – Discover Anime</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="nav-logo">Ani<span>Verse</span></a>
    <div class="nav-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search anime..." autocomplete="off" />
    </div>
  </nav>

  <!-- HERO -->
  <div class="hero">
    <h1>Your Anime Universe</h1>
    <p>500+ anime series – click any cover to start watching</p>
  </div>

  <!-- GENRE FILTERS -->
  <div class="filters" id="filters">
    <button class="filter-btn active" data-genre="all">All</button>
    <button class="filter-btn" data-genre="Action">Action</button>
    <button class="filter-btn" data-genre="Romance">Romance</button>
    <button class="filter-btn" data-genre="Isekai">Isekai</button>
    <button class="filter-btn" data-genre="Fantasy">Fantasy</button>
    <button class="filter-btn" data-genre="Sci-Fi">Sci-Fi</button>
    <button class="filter-btn" data-genre="Thriller">Thriller</button>
    <button class="filter-btn" data-genre="Slice of Life">Slice of Life</button>
    <button class="filter-btn" data-genre="Mecha">Mecha</button>
    <button class="filter-btn" data-genre="Sports">Sports</button>
    <button class="filter-btn" data-genre="Historical">Historical</button>
    <button class="filter-btn" data-genre="Supernatural">Supernatural</button>
  </div>

  <!-- GRID -->
  <div class="section-wrap">
    <div class="anime-grid" id="animeGrid"></div>
    <div class="load-more-wrap">
      <button class="load-more-btn" id="loadMoreBtn">Load More</button>
    </div>
  </div>

  <script src="anime_database.js"></script>
  <script src="app.js"></script>
</body>
</html>
